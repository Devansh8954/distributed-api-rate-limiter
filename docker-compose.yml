# All services communicate on a private isolated Docker network.
# They cannot be reached from outside except through explicitly published ports.
networks:
  gateway-net:
    driver: bridge

services:

  # ─── Redis ────────────────────────────────────────────────────────────────
  # redis-stack image includes both Redis and the RedisInsight web UI on port 8001
  redis:
    image: redis/redis-stack:latest
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"   # Redis protocol (clients connect here)
      - "8001:8001"   # RedisInsight web UI — visualise rate-limit keys in real time
    networks:
      - gateway-net
    volumes:
      - redis-data:/data  # Named volume — data persists across container restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── API Gateway ──────────────────────────────────────────────────────────
  # This is the Express app. It is only started AFTER Redis passes its healthcheck.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Inside Docker Compose, services communicate by service name, not localhost.
      # Docker's internal DNS resolves "redis" → the Redis container's IP automatically.
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT=10
      - WINDOW_SECONDS=60
      # Initial algorithm: 'fixed-window' | 'sliding-window' | 'token-bucket' | 'sliding-window-counter'
      # Can be changed live via POST /api/admin/config without restarting the container.
      - RATE_LIMIT_STRATEGY=fixed-window
    networks:
      - gateway-net
    depends_on:
      redis:
        condition: service_healthy   # Waits until Redis passes its healthcheck above
    restart: unless-stopped         # Auto-restarts on crash, but not manual docker stop

  # ─── Redis Commander (Web UI) ──────────────────────────────────────────────
  # Open http://localhost:8081 to visually browse and inspect Redis keys.
  # You can watch rate-limit counters being created, incremented, and expiring in real time.
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rate-limiter-ui
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - gateway-net
    depends_on:
      - redis

volumes:
  redis-data:  # Named volume — data survives "docker compose down" but NOT "docker compose down -v"
