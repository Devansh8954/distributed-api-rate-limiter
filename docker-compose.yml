version: '3.9'

# All services communicate on this private network
# They cannot be reached from outside except through published ports
networks:
  gateway-net:
    driver: bridge

services:

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack:latest
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"   # Redis protocol
      - "8001:8001"   # RedisInsight web UI (built into redis-stack image)
    networks:
      - gateway-net
    volumes:
      - redis-data:/data  # Persist data across container restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Inside Docker, use the service name "redis" as the hostname
      # Docker's internal DNS resolves "redis" → the redis container's IP
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT=10
      - WINDOW_SECONDS=60
      - RATE_LIMIT_STRATEGY=fixed-window
    networks:
      - gateway-net
    depends_on:
      redis:
        condition: service_healthy   # Wait until Redis passes its health check
    restart: unless-stopped

  # ─── Redis Commander (Web UI) ──────────────────────────────────────────────
  # Visit http://localhost:8081 to visually inspect Redis keys in real time
  # Watch rate-limit counters being created and expiring as you test!
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rate-limiter-ui
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - gateway-net
    depends_on:
      - redis

volumes:
  redis-data:  # Named volume — data survives "docker compose down"
