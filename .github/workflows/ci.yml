name: CI Pipeline (Pull Requests)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static analysis
        run: npm run lint

      - name: TypeScript strict type check
        run: npx tsc --noEmit

  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage
        run: npm run test:coverage

  docker-smoke-test:
    name: 🐳 Docker Container Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-rate-limiter:${{ github.sha }} .

      - name: Verify container health
        run: |
          docker network create test-net
          docker run -d --name test-redis --network test-net redis:7-alpine
          sleep 3

          docker run -d --name test-container \
            --network test-net \
            -e REDIS_URL=redis://test-redis:6379 \
            -e NODE_ENV=production \
            -p 3000:3000 \
            api-rate-limiter:${{ github.sha }}

          sleep 12

          curl --fail --retry 3 --retry-delay 3 http://localhost:3000/api/health \
            || (echo "--- Gateway logs ---" && docker logs test-container && exit 1)

          docker rm -f test-container test-redis
          docker network rm test-net

