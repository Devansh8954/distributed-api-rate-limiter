# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration & Automated Deployment to GCP Cloud Run
#
# Trigger: Whenever code is pushed to `main`, GitHub Actions will automatically:
#          1. Run ESLint & TypeScript type-checking
#          2. Execute unit & integration test suite (Jest)
#          3. Build Docker container & run health smoke test
#          4. Authenticate keylessly to GCP via Workload Identity Federation (WIF)
#          5. Deploy updated Docker image to GCP Cloud Run
#          6. Perform live post-deployment health check ping
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: api-rate-limiter
  REGISTRY: asia-south1-docker.pkg.dev
  IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/api-rate-limiter/gateway

jobs:
  # ─── Job 1: Static Analysis & Type Checking ─────────────────────────────────
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static analysis
        run: npm run lint

      - name: TypeScript strict type check
        run: npx tsc --noEmit

  # ─── Job 2: Test Suite Execution ───────────────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage
        run: npm run test:coverage

  # ─── Job 3: Docker Smoke Test ───────────────────────────────────────────────
  docker-smoke-test:
    name: 🐳 Docker Container Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-rate-limiter:${{ github.sha }} .

      - name: Verify container health
        run: |
          docker network create test-net
          docker run -d --name test-redis --network test-net redis:7-alpine
          sleep 3

          docker run -d --name test-container \
            --network test-net \
            -e REDIS_URL=redis://test-redis:6379 \
            -e NODE_ENV=production \
            -p 3000:3000 \
            api-rate-limiter:${{ github.sha }}

          sleep 12

          curl --fail --retry 3 --retry-delay 3 http://localhost:3000/api/health \
            || (echo "--- Gateway logs ---" && docker logs test-container && exit 1)

          docker rm -f test-container test-redis
          docker network rm test-net

  # ─── Job 4: Build, Push & Deploy to GCP Cloud Run ───────────────────────────
  deploy:
    name: 🚀 Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, docker-smoke-test]
    permissions:
      contents: read
      id-token: write   # Required for Keyless Workload Identity Federation (WIF) OIDC token exchange

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Keyless GCP authentication via Workload Identity Federation (OIDC)
      - name: Authenticate to GCP (WIF — keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "git-ref=${{ github.ref_name }}" \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            RATE_LIMIT=100
            WINDOW_SECONDS=60
            RATE_LIMIT_STRATEGY=sliding-window-counter
            REDIS_URL=${{ secrets.REDIS_URL }}
            ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=256Mi
            --cpu=1
            --port=3000
            --concurrency=80
            --timeout=30s

      - name: Live health check ping
        run: |
          echo "Live URL: ${{ steps.deploy.outputs.url }}"
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused \
            "${{ steps.deploy.outputs.url }}/api/health" \
            | grep -q '"status":"ok"' \
            && echo "✅ Live health check passed!" \
            || (echo "❌ Live health check failed" && exit 1)

      - name: Summary
        run: |
          echo "### 🚀 Automatic Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | URL / Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ env.SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dashboard** | ${{ steps.deploy.outputs.url }}/dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "| **API** | ${{ steps.deploy.outputs.url }}/api/v1/data |" >> $GITHUB_STEP_SUMMARY
          echo "| **Metrics** | ${{ steps.deploy.outputs.url }}/metrics |" >> $GITHUB_STEP_SUMMARY
