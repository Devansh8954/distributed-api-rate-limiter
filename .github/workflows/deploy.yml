name: CI/CD Pipeline

# One file handles everything:
#   On pull_request → run CI (lint + tests)
#   On push to main → run CI, then CD (Deploy to GCP Cloud Run)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: api-rate-limiter
  REGISTRY: asia-south1-docker.pkg.dev
  IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/api-rate-limiter/gateway

jobs:
  # ── Job 1: CI (Lint & Test) ──────────────────────────────────────────────────
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Run unit and integration tests
        run: npm run test:coverage

  # ── Job 2: CD (Build & Deploy) ───────────────────────────────────────────────
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # Required for keyless Workload Identity Federation (WIF)

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and tag Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "git-ref=${{ github.ref_name }}" \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            RATE_LIMIT=100
            WINDOW_SECONDS=60
            RATE_LIMIT_STRATEGY=sliding-window-counter
            REDIS_URL=${{ secrets.REDIS_URL }}
            ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=256Mi
            --cpu=1
            --port=3000
            --concurrency=80
            --timeout=30s

      - name: Live health check
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Live URL: $URL"
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused "$URL/api/health" \
            | grep -q '"status":"ok"' && echo "Health check passed!" || (echo "Health check FAILED" && exit 1)
