name: CI/CD - Distributed API Rate Limiter

# One file handles everything:
#   On pull_request → run lint + tests + docker smoke test (no deploy)
#   On push to main → run all checks, then deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: api-rate-limiter
  REGISTRY: asia-south1-docker.pkg.dev
  IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/api-rate-limiter/gateway

jobs:
  # ── Job 1: Lint + Type Check ─────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # ── Job 2: Unit + Integration Tests ─────────────────────────────────────────
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # ── Job 3: Docker Smoke Test ─────────────────────────────────────────────────
  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t api-rate-limiter:${{ github.sha }} .
      - name: Start Redis + container and run health check
        run: |
          docker network create test-net
          docker run -d --name test-redis --network test-net redis:7-alpine
          sleep 3
          docker run -d --name test-container --network test-net \
            -e REDIS_URL=redis://test-redis:6379 \
            -e NODE_ENV=production \
            -p 3000:3000 \
            api-rate-limiter:${{ github.sha }}
          sleep 12
          curl --fail --retry 3 --retry-delay 3 http://localhost:3000/api/health \
            || (docker logs test-container && exit 1)
          docker rm -f test-container test-redis
          docker network rm test-net

  # ── Job 4: Deploy to GCP Cloud Run (push to main only) ──────────────────────
  # Skipped on pull_request — only runs after a merge into main
  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, docker-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # Required for keyless Workload Identity Federation (WIF)

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and tag Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "git-ref=${{ github.ref_name }}" \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            RATE_LIMIT=100
            WINDOW_SECONDS=60
            RATE_LIMIT_STRATEGY=sliding-window-counter
            REDIS_URL=${{ secrets.REDIS_URL }}
            ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=256Mi
            --cpu=1
            --port=3000
            --concurrency=80
            --timeout=30s

      - name: Live health check
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Live URL: $URL"
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused "$URL/api/health" \
            | grep -q '"status":"ok"' && echo "Health check passed!" || (echo "Health check FAILED" && exit 1)

      - name: Write deployment summary
        run: |
          echo "### Deployment Complete"                                      >> $GITHUB_STEP_SUMMARY
          echo "| Resource  | Details |"                                      >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|"                                      >> $GITHUB_STEP_SUMMARY
          echo "| Service   | ${{ env.SERVICE }} |"                           >> $GITHUB_STEP_SUMMARY
          echo "| Region    | ${{ env.REGION }} |"                            >> $GITHUB_STEP_SUMMARY
          echo "| Image SHA | ${{ github.sha }} |"                            >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ steps.deploy.outputs.url }}/dashboard |"   >> $GITHUB_STEP_SUMMARY
          echo "| API       | ${{ steps.deploy.outputs.url }}/api/v1/data |" >> $GITHUB_STEP_SUMMARY
          echo "| Metrics   | ${{ steps.deploy.outputs.url }}/metrics |"     >> $GITHUB_STEP_SUMMARY
